name: Build
on:
  push:
  pull_request:
  workflow_dispatch:          # "Run workflow" button; the only trigger for the macOS job

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04     # oldest supported LTS, for glibc compatibility
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p pb-probe
      - uses: actions/upload-artifact@v7
        with:
          name: pb-probe-linux
          path: target/release/pb-probe
          retention-days: 7

  macos:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest     # Apple Silicon
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p pb-probe
      - uses: actions/upload-artifact@v7
        with:
          name: pb-probe-macos
          path: target/release/pb-probe
          retention-days: 7
