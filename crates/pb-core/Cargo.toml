[package]
name = "pb-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
if-addrs = "0.15.0"
reqwest = { version = "0.13.5", default-features = false, features = ["multipart"] }
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs", "time", "sync", "io-util"] }
ts-rs = "12.0.1"

[features]
# Test-only: allows a loopback mock tablet as the target. Never in release builds.
mock-device = []

[dev-dependencies]
pb-core = { path = ".", features = ["mock-device"] }
pb-mock-tablet = { path = "../pb-mock-tablet" }
